<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Personal Job Board</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <div>
          <p class="eyebrow">Daily search desk</p>
          <h1>Personal Job Board</h1>
        </div>
      </div>
    </header>

    <main>
      <section class="board-shell" aria-labelledby="board-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Industry boards</p>
            <h2 id="board-title">Saved Sites</h2>
          </div>
          <p class="section-note">Fast links for the sites you check often, grouped by search lane.</p>
        </div>

        <nav class="tabs" id="industry-tabs" aria-label="Industry boards"></nav>
        <div id="board-content" class="board-content" aria-live="polite"></div>
      </section>
    </main>

    <footer>
      <p>Edit <code>data/boards.json</code> to update your career pages, job boards, and keyword search destinations.</p>
    </footer>

    <script src="app.js" type="module"></script>
  </body>
</html>
